<!DOCTYPE html>
<html>
<head>
    <title>Bros Split</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4 text-primary">Welcome to Bros Split</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="members" class="form-label">Enter names (comma-separated):</label>
            <input type="text" name="members" class="form-control" placeholder="e.g. Alice, Bob, Charlie" required>
        </div>
        <button class="btn btn-success">Continue</button>
    </form>
    <footer class="text-center mt-5 text-muted">
        <hr>
        <p>Designed by <strong>Piyush</strong><br>Made in India</p>
    </footer>
</body>
</html>
