<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Bros Split</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            padding: 20px;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            font-size: 1em;
        }
        .footer {
            margin-top: 40px;
            font-weight: bold;
        }
        .footer span {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Welcome to Bros Split</h1>
    <form action="/add_names" method="POST">
        <input type="text" name="bill_name" placeholder="Enter Bill Name" required><br>
        <input type="text" name="new_name" placeholder="Enter a Bro's Name">
        <button type="submit" name="action" value="add">Add Bro</button><br>
        {% if names %}
            <h3>Added Bros:</h3>
            <ul>
                {% for name in names %}
                    <li>{{ name }} <a href="/delete_name/{{ name }}">❌</a></li>
                {% endfor %}
            </ul>
        {% endif %}
        <button type="submit" name="action" value="continue">Continue</button>
    </form>
    <div class="footer">
        <span><strong>Designed by Piyush</strong></span>
        <span><strong>Made in India</strong> 🇮🇳</span>
    </div>
</body>
</html>
